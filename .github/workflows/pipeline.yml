name: CI
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limit the permissions of the GITHUB_TOKEN.
permissions: {}

env:
  # Fail instead of updating uv.lock when it is out of date with pyproject.toml.
  UV_LOCKED: "1"

jobs:
  check-newsfile:
    name: Check PR has a changelog
    if: ${{ (github.base_ref == 'main' || contains(github.base_ref, 'release-')) && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repo.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.sha}}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install towncrier
      - run: "scripts-dev/check_newsfragment.sh ${{ github.event.number }}"

  checks:
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repo.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The oldest supported Python, so that mypy flags uses of newer
          # standard library APIs.
          python-version: "3.11"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Code style (ruff)
        run: uv run ruff format --diff .

      - name: Restore/persist mypy's cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mypy_cache
          key: mypy-cache-${{ github.context.sha }}
          restore-keys: mypy-cache-

      - name: Typechecking (mypy)
        run: uv run mypy

  docker:
    # Sanity check that we can build the x64 image
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repo.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          push: false

  run-tests:
    name: Tests
    if: ${{ !cancelled() && !failure() }} # Allow previous steps to be skipped, but not fail
    needs: [check-newsfile, checks]
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repo.
      contents: read
    strategy:
      matrix:
        # The oldest supported Python and the newest stable release.
        python-version: ['3.11', '3.15']
        test-dir: ['tests', 'integration-tests']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run pytest ${{ matrix.test-dir }}

  # a job which runs once all the other jobs are complete, thus allowing PRs to
  # be merged.
  tests-done:
    if: ${{ always() }}
    needs:
      - check-newsfile
      - checks
      - run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: matrix-org/done-action@3409aa904e8a2aaf2220f09bc954d3d0b0a2ee67 # v3
        with:
          needs: ${{ toJSON(needs) }}
          # The newsfile lint may be skipped on non PR builds or on dependabot builds
          skippable:
            check-newsfile

