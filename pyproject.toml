[project]
name = "matrix-sydent"
version = "2.7.0"
description = "Reference Matrix Identity Verification and Lookup Server"
readme = "README.rst"
license = "AGPL-3.0-only OR LicenseRef-Element-Commercial"
license-files = ["LICENSE-*"]
requires-python = ">=3.11"
authors = [
    { name = "Matrix.org Team and Contributors", email = "packages@matrix.org" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    # 19.2.0 is the oldest release that Twisted 21.2.0 accepts.
    "attrs>=19.2.0",
    # Jinja2 2.x does not import with MarkupSafe 2.1 and later.
    "jinja2>=3.0.0",
    # 1.1.0 adds matrix_common.versionstring.
    "matrix-common>=1.1.0",
    # Older releases do not build on Python 3.
    "netaddr>=0.7.10",
    # Sydent 2.7.0's floor was 8.12.32, which is yanked. The tests pass from 8.8.0,
    # and older releases have regular expressions that Python 3.11 rejects.
    "phonenumbers>=8.12.33",
    # Sydent 2.7.0's floor, copied from Synapse. The tests pass from 0.0.6, but
    # they do not check the metrics.
    "prometheus-client>=0.4.0",
    # Sydent 2.7.0's floor. The tests pass from 1.2.0, and older releases do not
    # build on Python 3.11.
    "pynacl>=1.2.1",
    # Older releases set no upper bound on cryptography, and do not import with
    # its current releases.
    "pyOpenSSL>=22.1.0",
    # Older releases import ABCs from collections, which Python 3.10 removed.
    "pyyaml>=5.1",
    # Without a usable service-identity, Twisted warns and falls back to a weaker
    # check of TLS server names. Twisted needs verify_ip_address, which 18.1.0
    # adds, and 18.1.0 imports six without depending on it.
    "service-identity>=21.1.0",
    # Sydent 2.7.0's pin. The tests pass from 1.1, the first release with
    # signedjson.types.
    "signedjson>=1.1.1",
    # Sydent 2.7.0's floor. The tests pass from 2.0.5, and older releases import
    # ABCs from collections, which Python 3.10 removed.
    "sortedcontainers>=2.1.0",
    # Older releases have no wheel for Python 3.11 and do not build on it.
    "twisted>=21.2.0",
    # 1.1.0 adds the urlsafe argument of encode_base64.
    "unpaddedbase64>=1.1.0",
    # Older releases do not build with current setuptools.
    "zope.interface>=4.7.2",
]

[project.optional-dependencies]
# 0.13.1 is the oldest release with sentry_sdk.set_tag.
sentry = ["sentry-sdk>=0.13.1"]
# prometheus-client is a required dependency. The extra remains so that
# installs which name it keep working. Its floor is the one above.
prometheus = ["prometheus-client>=0.4.0"]

[project.scripts]
sydent = "sydent.sydent:main"

[project.urls]
Repository = "https://github.com/element-hq/sydent"

[dependency-groups]
# The type stubs have no floor. CI runs mypy on the locked versions only.
dev = [
    # Older releases report UP038, which 0.13.0 drops.
    "ruff>=0.13.0",
    "matrix-is-tester",
    # Older releases do not know the exhaustive-match error code. CI runs mypy on
    # the locked version only.
    "mypy>=1.17.0",
    # 1.0.13 is the oldest release that accepts mypy 1.17.0.
    "mypy-zope>=1.0.13",
    # Older releases call inspect.getargspec, which Python 3.11 removed.
    "parameterized>=0.7.0",
    # 9.0 is the first release that reads the [tool.pytest] table.
    "pytest>=9.0",
    # mypy checks the Sentry calls. The floor is the sentry extra's.
    "sentry-sdk",
    "sortedcontainers-stubs",
    "types-Jinja2",
    "types-mock",
    "types-netaddr",
    "types-PyOpenSSL",
    "types-PyYAML",
    # Older releases import pkg_resources, which uv does not install.
    "towncrier>=23.6.0",
]

[tool.uv.workspace]
members = ["integration-tests"]

[tool.uv.sources]
matrix-is-tester = { workspace = true }

[tool.uv.build-backend]
module-name = "sydent"
module-root = ""
source-include = [
    "matrix-sydent.service",
    "res/**",
    "scripts/**",
    "integration-tests/**",
    "scripts-dev/**",
    "tests/**",
]

[tool.towncrier]
    package = "sydent"
    filename = "CHANGELOG.md"
    directory = "changelog.d"
    issue_format = "[\\#{issue}](https://github.com/element-hq/sydent/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "docker"
        name = "Updates to the Docker image"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "Deprecations and Removals"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Internal Changes"
        showcontent = true

[tool.mypy]
plugins = "mypy_zope:plugin"
strict = true
# Code that a narrowed type makes unreachable often means a wrong annotation.
warn_unreachable = true
# Every imported library has types, so an Any from a missing import is a bug.
disallow_any_unimported = true
enable_error_code = [
    # Every type: ignore names the error it silences.
    "ignore-without-code",
    # Conditions that are always true or always false.
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    # Names bound on only some paths.
    "possibly-undefined",
    # Calls to functions marked @deprecated.
    "deprecated",
    # Overrides that make a mutable attribute narrower.
    "mutable-override",
    # match statements that do not handle every case.
    "exhaustive-match",
    # A Self annotation that mypy would infer anyway.
    "redundant-self",
    # reveal_type without an import, which fails at runtime.
    "unimported-reveal",
]

files = [
    "sydent",
    "scripts",
    "scripts/generate-key",
    "integration-tests/matrix_is_tester",
]
mypy_path = "stubs"
# scripts/ has no __init__.py. This names scripts/casefold_db.py
# scripts.casefold_db, the module that the tests import.
explicit_package_bases = true

[[tool.mypy.overrides]]
# The integration tests come from matrix-org/matrix-is-tester without
# annotations. mypy still checks the bodies of their functions.
module = "matrix_is_tester.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# The except clause in update_local_associations only catches an exception
# raised inside the loop that binds `to_delete`.
module = "scripts.casefold_db"
disable_error_code = ["possibly-undefined"]

[tool.pytest]
# The integration suite binds fixed ports, so a bare `pytest` leaves it out.
# CI and CONTRIBUTING.md run it on its own with `pytest integration-tests`.
testpaths = ["tests"]

[tool.ruff]
line-length = 88
# A Python script without a .py suffix.
extend-include = ["scripts/generate-key"]

[tool.ruff.lint]
ignore = [
    # The formatter wraps what it can. The remaining long lines are strings and
    # comments.
    "E501",
    # printf-style formatting works the same on Python 3.11. Rewriting it as
    # f-strings has no automatic fix and changes nothing at runtime.
    "UP031",
    # Nested if statements often mirror the comments between them. Merging them
    # gains nothing.
    "SIM102",
    # try/except/pass reads as clearly as contextlib.suppress.
    "SIM105",
    # Sydent asserts invariants that the code already guarantees, so that mypy
    # can narrow types. Nothing runs Sydent with -O.
    "S101",
    # pytest's assertion rewriting already shows the value of each operand of a
    # combined assert.
    "PT018",
]
select = [
    # pycodestyle checks.
    "E",
    "W",
    # pyflakes checks.
    "F",
    # isort checks.
    "I",
    # pyupgrade: syntax and typing forms that Python 3.11 provides.
    "UP",
    # flake8-bugbear: likely bugs, such as unused loop variables and exceptions
    # raised without their cause.
    "B",
    # flake8-comprehensions: redundant list, set and dict calls.
    "C4",
    # flake8-pie: no-op statements such as an unneeded pass.
    "PIE",
    # flake8-simplify: files opened without a with block, and conditions with a
    # simpler equivalent.
    "SIM",
    # flake8-implicit-str-concat: adjacent string literals, which are often a
    # missing comma.
    "ISC",
    # Ruff's own rules: mutable defaults, unused unpacked variables and unused
    # noqa comments.
    "RUF",
    # flake8-logging-format and flake8-logging: log calls that format their
    # message eagerly or misuse the logging API.
    "G",
    "LOG",
    # pylint errors, such as log calls whose arguments do not match their
    # placeholders.
    "PLE",
    # flake8-bandit: SQL built from strings, weak randomness, subprocess calls
    # and similar security smells.
    "S",
    # flake8-async: blocking calls in coroutines, which stall the event loop.
    # It does not know sqlite3, which Sydent calls synchronously by design.
    "ASYNC",
    # flake8-datetimez: datetimes without a time zone.
    "DTZ",
    # flake8-pytest-style: consistent pytest idioms.
    "PT",
    # flake8-executable: shebangs that do not match the file mode.
    "EXE",
    # flake8-debugger: leftover breakpoints.
    "T10",
    # flake8-tidy-imports: relative imports from parent packages.
    "TID",
    # pygrep-hooks: noqa and type: ignore comments that name no error code.
    "PGH",
    # flake8-2020: sys.version comparisons that break on two-digit versions.
    "YTT",
    # flake8-slots: subclasses of str, tuple and namedtuple without __slots__.
    "SLOT",
]

[tool.ruff.lint.per-file-ignores]
"{tests,integration-tests}/**" = [
    # Tests use fixed secrets and non-cryptographic randomness.
    "S105",
    "S311",
    # The unit tests and matrix_is_tester are unittest suites, with unittest's
    # assertion methods.
    "PT009",
    "PT027",
]

[build-system]
# uv's documentation recommends a range within the current minor release, because
# a new minor release may change how packages are built.
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
