[project]
name = "matrix-sydent"
version = "2.7.0"
description = "Reference Matrix Identity Verification and Lookup Server"
readme = "README.rst"
license = "AGPL-3.0-only OR LicenseRef-Element-Commercial"
license-files = ["LICENSE-*"]
requires-python = ">=3.11"
authors = [
    { name = "Matrix.org Team and Contributors", email = "packages@matrix.org" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "attrs>=19.1.0",
    "jinja2>=3.0.0",
    "matrix-common>=1.1.0",
    "netaddr>=0.7.0",
    "phonenumbers>=8.12.32",
    # prometheus-client's lower bound is copied from Synapse.
    "prometheus-client>=0.4.0",
    "pynacl>=1.2.1",
    "pyOpenSSL>=16.0.0",
    "pyyaml>=3.11",
    # twisted warns about the absence of service-identity
    "service-identity>=1.0.0",
    "signedjson>=1.1.1",
    "sortedcontainers>=2.1.0",
    "twisted>=18.4.0",
    "unpaddedbase64>=1.1.0",
    "zope.interface>=4.6.0",
]

[project.optional-dependencies]
# sentry-sdk's lower bound is copied from Synapse.
sentry = ["sentry-sdk>=0.7.2"]
# prometheus-client is a required dependency. The extra remains so that
# installs which name it keep working.
prometheus = ["prometheus-client>=0.4.0"]

[project.scripts]
sydent = "sydent.sydent:main"

[project.urls]
Repository = "https://github.com/element-hq/sydent"

[dependency-groups]
dev = [
    "ruff",
    "matrix-is-tester",
    "mypy",
    "mypy-zope",
    "parameterized",
    # 9.0 is the first release that reads the [tool.pytest] table.
    "pytest>=9.0",
    # sentry-sdk is required for typechecking.
    "sentry-sdk",
    "types-Jinja2",
    "types-mock",
    "types-PyOpenSSL",
    "types-PyYAML",
    "towncrier",
]

[tool.uv.workspace]
members = ["integration-tests"]

[tool.uv.sources]
matrix-is-tester = { workspace = true }

[tool.uv.build-backend]
module-name = "sydent"
module-root = ""
source-include = [
    "matrix-sydent.service",
    "res/**",
    "scripts/**",
    "integration-tests/**",
    "scripts-dev/**",
    "tests/**",
]

[tool.towncrier]
    package = "sydent"
    filename = "CHANGELOG.md"
    directory = "changelog.d"
    issue_format = "[\\#{issue}](https://github.com/element-hq/sydent/issues/{issue})"

    [[tool.towncrier.type]]
        directory = "feature"
        name = "Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bugfixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "docker"
        name = "Updates to the Docker image"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "doc"
        name = "Improved Documentation"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "Deprecations and Removals"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Internal Changes"
        showcontent = true

[tool.mypy]
plugins = "mypy_zope:plugin"
show_error_codes = true
namespace_packages = true
strict = true

files = [
    # Find files that pass with
    #     find sydent tests -type d -not -name __pycache__ -exec bash -c "mypy --strict '{}' > /dev/null"  \; -print
    "sydent"
    # TODO the rest of CI checks these---mypy ought to too.
    # "tests",
    # "matrix_is_test",
    # "scripts",
    # "setup.py",
]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = [
    "idna",
    "netaddr",
    "signedjson.*",
    "sortedcontainers",
]
ignore_missing_imports = true

[tool.pytest]
# The integration suite binds fixed ports, so a bare `pytest` leaves it out.
# CI and CONTRIBUTING.md run it on its own with `pytest integration-tests`.
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
    # The formatter wraps what it can. The remaining long lines are strings and
    # comments.
    "E501",
]
select = [
    # pycodestyle checks.
    "E",
    "W",
    # pyflakes checks.
    "F",
    # isort checks.
    "I",
]

[build-system]
# uv's documentation recommends a range within the current minor release, because
# a new minor release may change how packages are built.
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
